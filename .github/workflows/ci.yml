name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      # Otherwise the first `mise run` also installs cargo-about (built from source) and actionlint.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only rust and uv: a plain `mise install` would also compile cargo-about from source.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: rust uv
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/uv
          key: judge-model-${{ runner.os }}-${{ hashFiles('tools/gen_judge_model.py', 'tools/gen_judge_model.py.lock', 'tools/judge.sha256') }}
      - run: scripts/check-no-network.sh
      # Only here, not in release.yml: a dependency aging past 7 days must not decide whether an
      # already-reviewed release can be rebuilt. Bumps are gated at PR time.
      - run: scripts/check-release-age.sh
      - run: mise run build
        env:
          RUSTFLAGS: -Dwarnings
      - run: scripts/check-no-network.sh --binary
      - run: cargo test --release
      - run: mise run scenarios
      - run: mise run scenarios-learning
      - run: mise run wysiwyg
      - run: mise run main-queue
      - run: mise run characterization
      - run: scripts/check-kkc.sh
      - run: mise run judge-model
      - run: mise run app
      - run: scripts/check-version.sh
      - run: scripts/stage-app.sh
      - run: scripts/sign-app.sh -
      - run: scripts/package-app.sh
      - name: Verify the packaged zip
        run: |
          set -eu
          check="$RUNNER_TEMP/verify"
          rm -rf "$check"; mkdir -p "$check"
          ditto -x -k dist/Shizuku-*.app.zip "$check"
          codesign --verify --deep --strict --verbose=2 "$check/Shizuku.app"
      - run: scripts/build-pkg.sh -
      - name: Verify the unsigned package
        run: |
          set -eu
          pkg="$(ls dist/Shizuku-*.pkg)"
          (cd dist && shasum -a 256 -c "$(basename "$pkg").sha256")
          expanded="$RUNNER_TEMP/pkg-expanded"
          rm -rf "$expanded"
          pkgutil --expand "$pkg" "$expanded"
          grep -q 'enable_currentUserHome="true"' "$expanded/Distribution"
          grep -q 'enable_localSystem="false"' "$expanded/Distribution"
          grep -q 'relocatable="false"' "$expanded/Shizuku.pkg/PackageInfo"
          pkgutil --payload-files "$pkg" | grep -qx './Shizuku.app/Contents/MacOS/shizuku'
      # The runner is thrown away afterwards, so installing into its home is harmless. No sudo:
      # the package only offers the current user's home.
      - name: Install the package into the runner's home
        run: |
          set -eu
          installer -pkg dist/Shizuku-*.pkg -target CurrentUserHomeDirectory
          codesign --verify --deep --strict --verbose=2 "$HOME/Library/Input Methods/Shizuku.app"
          [ ! -e "/Library/Input Methods/Shizuku.app" ] || { echo "the package installed system-wide" >&2; exit 1; }
