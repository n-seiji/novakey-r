[package]
name = "novakey_r"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSString", "NSAutoreleasePool", "NSBundle", "NSRange", "NSObjCRuntime"] }
libc = "0.2"
rand = "0.8.4"
once_cell = "1.19"
regex = "1"
unicode-segmentation = "1"
unicode-normalization = "0.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
security-framework = "3.7.0"
serde_json = "1.0.149"
