[package]
name = "novakey_r"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
objc2 = { version = "0.5", features = ["exception"] }
# objc2::ffi::try_catch は unstable-exception 機能で semver 対象外なので、版を固定する
objc-sys = { version = "=0.3.5", features = ["unstable-exception"] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSString", "NSAutoreleasePool", "NSBundle", "NSRange", "NSObjCRuntime"] }
regex = "1"
unicode-segmentation = "1"
unicode-normalization = "0.1"
serde_json = "1.0.149"
# 端末内 LM の審判 (全文候補の並べ替え)
candle-core = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
rayon = "1"

# C-unwind のフレームを ObjC 例外が通るため、panic を abort にしない
[profile.release]
panic = "unwind"
