[tools]
rust = "1.99.1"
uv = "latest"
"cargo:cargo-about" = { version = "0.9.2", features = "cli" }

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"

[tasks.test]
description = "Run unit tests"
run = "cargo test"

[tasks.simulate]
env = { NOVAKEY_DICTIONARY = "{{config_root}}/dictionary" }
description = "キー列を headless で流して結果を表示する (mise run simulate -- 'kyouha<space><enter>')"
run = "cargo run --release -- --simulate"

[tasks.scenarios]
env = { NOVAKEY_DICTIONARY = "{{config_root}}/dictionary" }
description = "tools/scenarios.txt を流す。期待付きの行が外れたら失敗"
run = "cargo run --release -- --simulate-file tools/scenarios.txt"

[tasks.characterization]
env = { NOVAKEY_DICTIONARY = "{{config_root}}/dictionary" }
description = "現挙動の固定 (tools/characterization.txt)。リアーキ中に出力が変わったら失敗"
run = "cargo run --release -- --simulate-file tools/characterization.txt"

[tasks.wysiwyg]
env = { NOVAKEY_DICTIONARY = "{{config_root}}/dictionary" }
description = "各キーのあと、未確定ローマ字が無ければ下線付きの表示と Enter で確定される文字列が一致するかを scenarios / characterization の全行で確かめる"
run = "cargo run --release -- --simulate-file tools/scenarios.txt --check-preedit && cargo run --release -- --simulate-file tools/characterization.txt --check-preedit"

[tasks.main-queue]
description = "別スレッドから積んだ処理がメインスレッドで投入順に実行される (途中の panic で止まらない) ことを確かめる"
run = "cargo run --release -- --check-main-queue"

[tasks.scenarios-learning]
env = { NOVAKEY_DICTIONARY = "{{config_root}}/dictionary" }
description = "学習ありのシナリオを流す (記憶は一時ディレクトリ)"
run = "NOVAKEY_SIM_LEARNING=1 cargo run --release -- --simulate-file tools/learning_scenarios.txt"




[tasks.kkc-compare]
env = { NOVAKEY_DICTIONARY = "{{config_root}}/dictionary" }
description = "Rust 版 KKC を azooKey (Swift) 版の golden と比べる (mise run kkc-compare -- --golden tools/golden/typed.jsonl.gz --show 20)"
depends = ["build"]
run = "./target/release/novakey_r --kkc-compare"

[tasks.reset-memory]
description = "変換学習データを全消去する"
run = "rm -rf \"$HOME/Library/Application Support/NovakeyR\" && echo 'Learning memory cleared.'"

[tasks.app]
description = "Package the release binary into output/NovakeyR.app"
depends = ["build"]
run = """
rm -rf output/NovakeyR.app
mkdir -p output/NovakeyR.app/Contents/MacOS
mkdir -p output/NovakeyR.app/Contents/Resources
cp Info.plist output/NovakeyR.app/Contents/
cp target/release/novakey_r output/NovakeyR.app/Contents/MacOS/
cp -R resources/. output/NovakeyR.app/Contents/Resources/
cp -R dictionary output/NovakeyR.app/Contents/Resources/dictionary
cp LICENSE NOTICE THIRD_PARTY_LICENSES output/NovakeyR.app/Contents/Resources/
"""

[tasks.licenses]
description = "Regenerate THIRD_PARTY_LICENSES (Rust crate licenses) with cargo-about"
run = "cargo about generate about.hbs -o THIRD_PARTY_LICENSES"

[tasks.judge-model]
description = "端末内の審判モデル (rinna/japanese-gpt2-xsmall の q8_0 と tokenizer) を Hugging Face から作って resources/judge/ に置く。mise run app が .app に入れる"
run = "uv run --script tools/gen_judge_model.py"

[tasks.judge-bench]
env = { NOVAKEY_DICTIONARY = "{{config_root}}/dictionary", NOVAKEY_JUDGE_DIR = "{{config_root}}/resources/judge" }
description = "審判の精度と時間を測る (mise run judge-bench -- testset.tsv。1 行 = 読み<TAB>正解(|区切り))"
depends = ["build"]
run = "./target/release/novakey_r --judge-bench"

[tasks.clean]
description = "Remove the generated app bundle"
run = "rm -rf output/NovakeyR.app"

[tasks.run]
description = "Run the packaged binary directly (smoke test)"
depends = ["app"]
run = "./output/NovakeyR.app/Contents/MacOS/novakey_r"

[tasks.install]
description = "Install NovakeyR.app into ~/Library/Input Methods (no sudo needed)"
depends = ["app"]
run = """
[ -d "/Library/Input Methods/NovakeyR.app" ] && \
  echo "Warning: /Library/Input Methods/NovakeyR.app was found. This older system-wide install can cause duplicate entries in Input Sources. Please remove it manually with: sudo rm -rf /Library/Input Methods/NovakeyR.app"
pkill -x novakey_r || true
mkdir -p "$HOME/Library/Input Methods"
# バンドルを消して作り直すと macOS が入力ソースの一覧から外すので、中身だけ入れ替える。
rsync -a --delete output/NovakeyR.app/ "$HOME/Library/Input Methods/NovakeyR.app/"
echo "Installed. Re-login (or restart) and add NovakeyR from System Settings > Keyboard > Input Sources."
"""

[tasks.uninstall]
description = "Remove NovakeyR.app from ~/Library/Input Methods"
run = """
pkill -x novakey_r || true
rm -rf "$HOME/Library/Input Methods/NovakeyR.app"
echo "Uninstalled NovakeyR."
"""

[tasks.logs]
description = "Stream NSLog output from the running IME"
run = "log stream --predicate 'process == \"novakey_r\"'"
