<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 480 360" fill="none" role="img" aria-label="Space で変換し、Enter で確定する">
  <style>
    .f { opacity: 0; animation: show 4.8s infinite; }
    @keyframes show { 0% { opacity: 0 } 3% { opacity: 1 } 33.33% { opacity: 1 } 36.33% { opacity: 0 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .f { animation: none } .f2 { opacity: 1 } }
    .f0 { animation-delay: -4.80s; }
    .f1 { animation-delay: -3.20s; }
    .f2 { animation-delay: -1.60s; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f23"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="44" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="479" height="359" rx="43.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="36" y="40" width="408" height="280" rx="18" fill="#151517" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <g class="f f0">
    <text x="62" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#f5f5f7" fill-opacity="0.45">TYPING</text>
    <text x="62" y="150" font-family="Hiragino Sans, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif" font-size="30" fill="#f5f5f7">あしたははれです</text><line x1="62" y1="160" x2="302" y2="160" stroke="#f5f5f7" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="62" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#f5f5f7" fill-opacity="0.4">keys</text><text x="120" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#f5f5f7" fill-opacity="0.85">ashitahaharedesu</text>
  </g>
  <g class="f f1">
    <text x="62" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#f5f5f7" fill-opacity="0.45">SPACE</text>
    <text x="62" y="150" font-family="Hiragino Sans, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif" font-size="30" fill="#f5f5f7">明日は晴れです</text><line x1="62" y1="160" x2="272" y2="160" stroke="#f5f5f7" stroke-width="2.5"/>
    <rect x="56" y="186" width="300" height="114" rx="10" fill="#202024" stroke="#ffffff" stroke-opacity="0.18"/><rect x="62" y="192" width="288" height="32" rx="7" fill="#f5f5f7"/><text x="76" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#121214" fill-opacity="0.55">1</text><text x="100" y="215" font-family="Hiragino Sans, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif" font-size="19" fill="#121214">明日は晴れです</text><text x="76" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#f5f5f7" fill-opacity="0.55">2</text><text x="100" y="249" font-family="Hiragino Sans, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif" font-size="19" fill="#f5f5f7">ashitahaharedesu</text><text x="76" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#f5f5f7" fill-opacity="0.55">3</text><text x="100" y="283" font-family="Hiragino Sans, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif" font-size="19" fill="#f5f5f7">明日は腫れです</text>
  </g>
  <g class="f f2">
    <text x="62" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#f5f5f7" fill-opacity="0.45">ENTER</text>
    <text x="62" y="150" font-family="Hiragino Sans, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif" font-size="30" fill="#f5f5f7">明日は晴れです</text><rect x="276" y="124" width="2.5" height="32" rx="1" fill="#5b8cff"/>
    <text x="62" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#f5f5f7" fill-opacity="0.4">keys</text><text x="120" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#f5f5f7" fill-opacity="0.85">⏎</text>
  </g>
</svg>
